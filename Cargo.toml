[package]
name = "eastmoney-cli"
version = "0.1.0"
edition = "2021"
description = "东方财富 A 股数据命令行工具（行情/大盘/股吧热榜/自选股）"

[[bin]]
name = "em"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
